[package]
name = "platform-macos"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
async-trait = "0.1"
uuid = { workspace = true }
time = { workspace = true }
indexmap = "2"
cua-driver-core = { path = "../cua-driver-core" }
cua-driver-contract = { path = "../cua-driver-contract" }
cursor-overlay = { path = "../cursor-overlay" }
pip-preview = { path = "../pip-preview" }

[target.'cfg(target_os = "macos")'.dependencies]
clipboard-rs = "0.3.5"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra", "elcapitan"] }
foreign-types = "0.5"
libc = "0.2"
block2 = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSArray", "NSString", "NSDictionary", "NSRunLoop",
    "NSThread", "NSObject", "NSValue",
    "NSAppleEventDescriptor", "NSNotification", "NSOperation",
    "NSURL", "NSDate", "NSError",
    "block2", "libc",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSApplication", "NSWindow", "NSScreen", "NSColor",
    "NSEvent", "NSRunningApplication", "NSWorkspace",
    "NSView", "NSGraphicsContext", "NSResponder",
    "NSImage", "NSImageView", "NSTextField", "NSControl", "NSCell",
    "block2", "libc",
] }
objc2-quartz-core = { version = "0.2", features = ["CALayer"] }

# Monterey compatibility branch intentionally has no screencapturekit crate.
# Still captures use /usr/sbin/screencapture and native video recording is
# stubbed, removing the Swift bridge/toolchain dependency entirely.
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_15"] }
zeroize = { workspace = true }
getrandom = { workspace = true }
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
